version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "[deps]"
      include: "scope"
    reviewers:
      - "lain"
    assignees:
      - "lain"
    # The bun ecosystem cannot update transitive dependencies on their own.
    allow:
      - dependency-type: "direct"
    groups:
      # react and react-dom must stay on the exact same version or the build fails.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]